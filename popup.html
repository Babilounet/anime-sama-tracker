<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Anime-Sama Tracker</h1>

    <div class="domain-section">
      <div class="domain-header" id="domain-toggle">
        <span>Domaine</span>
        <span id="domain-current" class="domain-current"></span>
      </div>
      <div id="domain-config" style="display: none;">
        <div id="domain-history-list" class="domain-history"></div>
        <div class="domain-manual">
          <input type="text" id="domain-input" placeholder="ex: anime-sama.new">
          <button id="btn-domain-set">Appliquer</button>
        </div>
      </div>
    </div>

    <div id="anime-list"></div>

    <div id="empty-state" class="empty-state" style="display: none;">
      Aucun anime suivi pour le moment.<br>
      Visitez anime-sama et cliquez sur des épisodes !
    </div>


    <div class="sync-section">
      <div class="sync-header" id="sync-toggle">
        <span>GitHub Sync</span>
        <span id="sync-status"></span>
      </div>
      <div id="sync-config" style="display: none;">
        <p class="sync-info">
          Pour synchroniser entre navigateurs, crée un token GitHub avec le scope <strong>gist</strong> :
          <a href="https://github.com/settings/tokens/new?scopes=gist&description=Anime-Sama%20Tracker" id="token-link">Créer un token</a>
        </p>
        <input type="password" id="gh-token" placeholder="Colle ton token ici">
        <div class="sync-actions">
          <button id="btn-sync">Synchroniser</button>
          <button id="btn-sync-disconnect" class="btn-small-danger" style="display: none;">Deconnecter</button>
        </div>
        <div id="sync-msg" class="sync-msg"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
